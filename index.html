<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEXUS GAMES HUB</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');
:root{
  --bg:#050508;--bg2:#0a0a12;--panel:#080810;
  --border:rgba(100,100,255,0.15);--accent:#4466ff;--accent2:#00d4ff;
  --text:#c8c8e8;--text-dim:#5a5a7a;--danger:#ff3355;--success:#00ff88;
  --glow:rgba(68,102,255,0.4);
  --font-display:'Orbitron',monospace;--font-body:'Rajdhani',sans-serif;--font-mono:'JetBrains Mono',monospace;
}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{min-height:100vh;background:var(--bg);color:var(--text);font-family:var(--font-body);font-size:15px;}
body{background-image:radial-gradient(ellipse at 50% 0%,rgba(68,102,255,0.06) 0%,transparent 60%);}

/* HEADER */
.hub-header{text-align:center;padding:48px 20px 32px;position:relative;}
.hub-logo{font-family:var(--font-display);font-size:clamp(28px,5vw,52px);font-weight:900;letter-spacing:8px;
  background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  text-shadow:none;filter:drop-shadow(0 0 20px rgba(68,102,255,0.5));}
.hub-sub{font-family:var(--font-mono);font-size:11px;letter-spacing:4px;color:var(--text-dim);margin-top:6px;}
.hub-count{display:inline-block;margin-top:14px;font-family:var(--font-mono);font-size:10px;letter-spacing:3px;
  color:var(--accent2);border:1px solid rgba(0,212,255,0.25);border-radius:20px;padding:4px 14px;
  background:rgba(0,212,255,0.06);}

/* SEARCH / FILTER */
.hub-controls{display:flex;gap:12px;padding:0 20px 24px;max-width:1200px;margin:0 auto;align-items:center;flex-wrap:wrap;}
.hub-search{flex:1;min-width:200px;background:var(--panel);border:1px solid var(--border);
  color:var(--text);padding:10px 16px;border-radius:8px;font-family:var(--font-mono);font-size:12px;outline:none;
  transition:border-color 0.3s;}
.hub-search:focus{border-color:var(--accent);box-shadow:0 0 16px var(--glow);}
.hub-search::placeholder{color:var(--text-dim);}

/* GRID */
.games-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px;
  padding:0 20px 60px;max-width:1200px;margin:0 auto;}

/* CARD */
.game-card{background:var(--panel);border:1px solid var(--border);border-radius:14px;overflow:hidden;
  cursor:pointer;transition:all 0.25s;position:relative;}
.game-card:hover{transform:translateY(-4px);border-color:rgba(68,102,255,0.5);box-shadow:0 12px 40px rgba(68,102,255,0.2);}
.game-card::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;
  background:linear-gradient(90deg,transparent,rgba(68,102,255,0.4),transparent);opacity:0;transition:opacity 0.25s;}
.game-card:hover::before{opacity:1;}
.card-icon{font-size:40px;padding:24px 0 12px;text-align:center;display:block;
  filter:drop-shadow(0 0 12px rgba(68,102,255,0.4));}
.card-body{padding:0 18px 18px;}
.card-name{font-family:var(--font-display);font-size:12px;letter-spacing:2px;font-weight:700;color:#e8e8ff;margin-bottom:6px;}
.card-desc{font-size:12px;color:var(--text-dim);line-height:1.5;}
.card-play{display:flex;align-items:center;justify-content:center;gap:6px;margin-top:14px;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  color:#fff;border:none;border-radius:8px;padding:8px 18px;font-family:var(--font-display);
  font-size:10px;letter-spacing:3px;cursor:pointer;width:100%;transition:all 0.2s;}
.card-play:hover{transform:none;box-shadow:0 4px 20px var(--glow);}

/* NO RESULTS */
.no-results{grid-column:1/-1;text-align:center;padding:60px 20px;color:var(--text-dim);
  font-family:var(--font-mono);font-size:13px;letter-spacing:2px;}

/* MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.85);z-index:100;
  display:none;align-items:center;justify-content:center;}
.modal-overlay.active{display:flex;}
.modal{background:var(--bg2);border:1px solid var(--border);border-radius:16px;
  width:min(95vw,1000px);height:min(90vh,700px);display:flex;flex-direction:column;overflow:hidden;
  box-shadow:0 0 80px rgba(68,102,255,0.25);}
.modal-header{display:flex;align-items:center;gap:12px;padding:14px 18px;
  border-bottom:1px solid var(--border);flex-shrink:0;}
.modal-title{font-family:var(--font-display);font-size:13px;letter-spacing:3px;color:var(--accent2);flex:1;}
.modal-close{background:none;border:1px solid var(--border);color:var(--text-dim);
  border-radius:6px;padding:6px 12px;cursor:pointer;font-size:16px;transition:all 0.2s;}
.modal-close:hover{border-color:var(--danger);color:var(--danger);}
.modal iframe{flex:1;border:none;background:#000;}

/* SCANLINE OVERLAY */
body::after{content:'';position:fixed;inset:0;pointer-events:none;z-index:200;
  background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,0.015) 2px,rgba(0,0,0,0.015) 4px);}
</style>
</head>

function decodeB64Html(b64){
  const bin=atob(b64);
  const bytes=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);
  return new TextDecoder('utf-8').decode(bytes);
}

function renderCards(filter){
  const grid=document.getElementById('gamesGrid');
  const f=(filter||'').toLowerCase().trim();
  const filtered=f?GAMES.filter(g=>g.name.toLowerCase().includes(f)||g.desc.toLowerCase().includes(f)):GAMES;
  document.getElementById('gameCount').textContent=filtered.length+' / '+GAMES.length+' GAMES';
  if(!filtered.length){grid.innerHTML='<div class="no-results">No games match your search.</div>';return;}
  grid.innerHTML=filtered.map(g=>`
    <div class="game-card" onclick="openGame(${g.id})">
      <span class="card-icon">${g.icon}</span>
      <div class="card-body">
        <div class="card-name">${g.name}</div>
        <div class="card-desc">${g.desc}</div>
        <button class="card-play">▶ PLAY</button>
      </div>
    </div>`).join('');
}

function openGame(id){
  const g=GAMES.find(x=>x.id===id);if(!g)return;
  document.getElementById('modalTitle').textContent=g.icon+' '+g.name;
  const html=decodeB64Html(g.b64);
  const blob=new Blob([html],{type:'text/html'});
  const url=URL.createObjectURL(blob);
  const frame=document.getElementById('gameFrame');
  frame.src=url;
  frame.onload=()=>setTimeout(()=>URL.revokeObjectURL(url),5000);
  document.getElementById('gameModal').classList.add('active');
  document.body.style.overflow='hidden';
}

function closeGame(){
  const frame=document.getElementById('gameFrame');
  frame.src='about:blank';
  document.getElementById('gameModal').classList.remove('active');
  document.body.style.overflow='';
}

document.getElementById('searchInput').addEventListener('input',e=>renderCards(e.target.value));
document.getElementById('gameModal').addEventListener('click',e=>{if(e.target===e.currentTarget)closeGame();});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeGame();});

renderCards('');
</script>
</body>
</html>
